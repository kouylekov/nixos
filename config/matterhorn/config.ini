[mattermost]
host = mattermost.uio.no
team = USIT-UIO
user = milen

tokencmd = /home/milen/nixos/scripts/matterhorn-token

urlOpenCommand = xdg-open

activityNotifyCommand = /home/milen/.config/matterhorn/notify

showTypingIndicator = True

enableAspell = True
aspellDictionary = "en"

[keybindings]
focus-next-unread = C-a
invoke-editor = C-k
toggle-multiline = F7
