# Font configuration
[font]
size = 15.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.offset]
x = 0
y = 2

[font.glyph_offset]
x = 0
y = 1

# Window appearance
[window]
opacity = 0.95
blur = true
padding = { x = 8, y = 8 }
decorations_theme_variant = "Dark"

# Color scheme (Nord-inspired, on dark background)
[colors.primary]
background = "#141414"
foreground = "#e5e9f0"

[colors.cursor]
cursor = "#88c0d0"
text = "#141414"

# Nord palette
[colors.normal]
black = "#3b4252"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#88c0d0"
white = "#e5e9f0"

[colors.bright]
black = "#4c566a"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#8fbcbb"
white = "#eceff4"

# Cursor
[cursor]
style = { shape = "Block", blinking = "Off" }

# Mouse behavior
[mouse]
hide_when_typing = true

# copy-on-select
[selection]
save_to_clipboard = true

[terminal]
osc52 = "CopyPaste"
